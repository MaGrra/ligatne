<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- UNLISTED, NOT PRIVATE. GitHub Pages serves this to anyone who has the URL.
     robots/noindex keeps it out of search engines and nothing links to it, but
     it is obscurity, not access control. -->
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Iekšējais · TOP 3 pa uzdevumiem</title>
<style>
:root{--ink:#12211a;--forest:#0E3B2A;--line:#dfe6e0;--dim:#6b7a6f;--gold:#b8912f}
*{box-sizing:border-box}
body{margin:0;background:#f6f8f6;color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--forest);color:#fff;padding:12px 14px}
.h1{font-size:17px;font-weight:800;letter-spacing:.01em}
.meta{font-size:12px;opacity:.85;margin-top:3px}
.warn{background:#7a2d2d;color:#fff;font-size:12px;padding:7px 14px}
nav{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:66px;z-index:4}
nav button{flex:1;padding:8px 6px;border:0;border-radius:9px;font:inherit;font-size:13px;
  font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#e9eee9;color:#3a4a3a}
nav button[aria-selected=true]{background:var(--forest);color:#fff}
main{padding:12px 10px 60px;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ct{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline;gap:8px}
.cc{font-weight:800;font-size:13px;color:var(--forest)}
.cn{font-size:12px;color:var(--dim);text-align:right;flex:1}
.r{display:flex;align-items:center;gap:9px;padding:7px 12px;border-top:1px solid #f0f3f0}
.r:first-of-type{border-top:0}
.p{width:22px;height:22px;border-radius:50%;background:#eef1ee;color:#5a6a5e;
  font-size:12px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.r.g1 .p{background:var(--gold);color:#fff}
.nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr{font-size:11px;color:var(--dim);flex:0 0 auto}
.v{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.none{padding:9px 12px;color:var(--dim);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8fd18f;margin-right:5px}
.dot.stale{background:#e5b23c}.dot.off{background:#d96b6b}
button.rf{margin:14px auto 0;display:block;padding:9px 16px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font:inherit;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="h1">TOP 3 pa uzdevumiem · iekšējai lietošanai</div>
  <div class="meta"><span class="dot" id="dot"></span><span id="stamp">ielādē…</span></div>
</header>
<div class="warn">Nav paredzēts dalībniekiem. Saite ir neuzminējama, bet nav aizsargāta ar paroli — nesūti to tālāk.</div>
<nav role="tablist" id="gnav"></nav>
<main>
  <div class="grid" id="grid"></div>
  <button class="rf" id="rf">Atjaunot tagad</button>
</main>
<script>
/* Reads the SAME public mirror as the board and works out the top 3 per task in
   the browser. No extra spreadsheet, no extra requests, one data path to keep
   working. Baudītāji are deliberately absent: they have no scores, only
   attendance ticks, so there is nothing to rank. */
const SHEET_ID = '1c8sSEoA28Ki13tOdA8XdzBJ7dhc42AjJtKDHCHfYZAU';
const GROUPS = [
  {key:'Sporta', label:'Sporta', gid:'0',         tFirst:2, tLast:27},
  {key:'Tautas', label:'Tautas', gid:'110833847', tFirst:2, tLast:24}
];
const REFRESH_MS = 30000;
const TOPN = 3;
const MAXROWS = 6;      /* a tie can run to dozens; do not print them all */
const src = g => 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+
                 '/export?format=csv&gid='+g.gid+'&t='+Date.now();
const CACHE = k => 'swd-top3-'+k;

let GKEY = 'Tautas', ALL = {}, LASTOK = Date.now(), OK = true;
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c;
                        if(h!==undefined)e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"'){ q=true; }
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r'){ f+=c; }
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
const cellNum = v => {
  const s=(v==null?'':String(v)).trim();
  if(s==='') return null;
  const n=parseFloat(s.replace(',','.'));
  return isNaN(n)?null:n;
};

function shape(rows, g){
  const head = rows[1] || [];
  const tasks = [];
  for(let c=g.tFirst;c<=g.tLast;c++){
    const raw=(head[c]||'').trim(); if(!raw) continue;
    const sp=raw.indexOf(' ');
    tasks.push({col:c, code: sp<0?raw:raw.slice(0,sp), name: sp<0?raw:raw.slice(sp+1), rows:[]});
  }
  for(let r=2;r<rows.length;r++){
    const row=rows[r]; if(!row) continue;
    const nr=(row[0]||'').trim(), name=(row[1]||'').trim();
    if(!/^\d+$/.test(nr) || !name) continue;   /* a numbered row with no name is not a team */
    tasks.forEach(t=>{
      const v=cellNum(row[t.col]);
      if(v!==null) t.rows.push({nr:+nr, name, v});
    });
  }
  tasks.forEach(t=>{
    t.rows.sort((a,b)=>(b.v-a.v)||(a.nr-b.nr));
    /* Ties share the place, so a three-way tie for first shows three golds and
       no second -- the same rule the scoring itself uses. */
    let place=0, prev=null;
    t.rows.forEach((x,i)=>{ if(x.v!==prev){ place=i+1; prev=x.v; } x.place=place; });
    t.top = t.rows.filter(x=>x.place<=TOPN);
    t.n = t.rows.length;
    /* An all-or-nothing task (SU1, SU3) gives every finisher the same score, so
       everyone ties for first and there is nothing to single out. Say that
       instead of printing sixty names under a "TOP 3" heading. */
    const distinct = new Set(t.rows.map(x=>x.v)).size;
    t.flat = t.n > 1 && distinct === 1;
    t.hidden = Math.max(0, t.top.length - MAXROWS);
    if(t.hidden) t.top = t.top.slice(0, MAXROWS);
  });
  return tasks;
}

function render(){
  const g=GROUPS.find(x=>x.key===GKEY);
  const tasks=ALL[GKEY];
  const grid=$('#grid'); grid.innerHTML='';
  if(!tasks){ grid.appendChild(el('div','none','Nav datu.')); return; }
  tasks.forEach(t=>{
    const c=el('div','card');
    c.appendChild(el('div','ct','<span class="cc">'+esc(t.code)+'</span>'+
      '<span class="cn">'+esc(t.name)+'<br>'+t.n+' ar rezultātu</span>'));
    if(!t.top.length){ c.appendChild(el('div','none','vēl nav rezultātu')); }
    else if(t.flat){
      c.appendChild(el('div','none','visām '+t.n+' komandām vienāds rezultāts ('+
        t.rows[0].v+') — nav ko izcelt'));
    }
    else {
      t.top.forEach(x=>{
        c.appendChild(el('div','r'+(x.place===1?' g1':''),
          '<span class="p">'+x.place+'</span>'+
          '<span class="nm">'+esc(x.name)+'</span>'+
          '<span class="nr">Nr.&nbsp;'+x.nr+'</span>'+
          '<span class="v">'+x.v+'</span>'));
      });
      if(t.hidden) c.appendChild(el('div','none','+ vēl '+t.hidden+
        ' ar tādu pašu rezultātu'));
    }
    grid.appendChild(c);
  });
  [...$('#gnav').children].forEach(b=>b.ariaSelected=String(b.dataset.g===GKEY));
  const s=Math.round((Date.now()-LASTOK)/1000);
  $('#stamp').textContent = OK
    ? (s<60?'atjaunots pirms '+s+' s':'atjaunots pirms '+Math.round(s/60)+' min')
    : 'nav savienojuma';
  $('#dot').className='dot'+(!OK?' off':(Date.now()-LASTOK>3*REFRESH_MS?' stale':''));
}

async function loadOne(g){
  try{
    const res=await fetch(src(g),{cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    ALL[g.key]=shape(parseCSV(text),g);
    try{ localStorage.setItem(CACHE(g.key),text); }catch(e){}
    return true;
  }catch(e){
    if(!ALL[g.key]){
      try{
        const t=localStorage.getItem(CACHE(g.key));
        if(t) ALL[g.key]=shape(parseCSV(t),g);
      }catch(_){}
    }
    return false;
  }
}
async function load(){
  /* Both groups every time: this page is read on a laptop at the finish, not on
     a phone in a forest, and switching tabs should be instant. */
  const oks=await Promise.all(GROUPS.map(loadOne));
  OK=oks.some(Boolean);
  if(OK) LASTOK=Date.now();
  render();
}
GROUPS.forEach(g=>{
  const b=el('button','',esc(g.label));
  b.setAttribute('role','tab'); b.dataset.g=g.key;
  b.onclick=()=>{ GKEY=g.key; render(); };
  $('#gnav').appendChild(b);
});
$('#rf').onclick=load;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
/* No cutoff here on purpose: the shout-outs happen at the ceremony, which is
   after the public board has closed. */
load();
setInterval(load, REFRESH_MS);
setInterval(render, 1000);
</script>
</body>
</html>
