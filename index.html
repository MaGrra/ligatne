<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Rezultāti · Līgatne</title>
<style>
:root{
  --bg:#f4f6f4; --card:#fff; --ink:#12181a; --muted:#6b7a72; --line:#e3e8e4;
  --brand:#14532d; --brand2:#2f7a4a; --accent:#e8a020;
  --g1:#d4a017; --g2:#9aa5ad; --g3:#b3743a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1512;--card:#16201c;--ink:#eaf0ec;--muted:#93a49b;--line:#243029;
        --brand:#1d6b3c;--brand2:#3d9960;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(160deg,var(--brand),var(--brand2));
  color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  box-shadow:0 2px 12px rgba(0,0,0,.18);
}
.h-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.92;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#7ef2a8;animation:pulse 2.4s infinite}
.dot.stale{background:#ffce5c;animation:none}
.dot.off{background:#ff8b78;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(126,242,168,.6)}70%{box-shadow:0 0 0 7px rgba(126,242,168,0)}100%{box-shadow:0 0 0 0 rgba(126,242,168,0)}}
nav{display:flex;gap:6px;margin-top:14px}
nav button{
  flex:1;appearance:none;border:0;border-radius:999px;padding:10px 6px;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.16);color:#fff;transition:background .15s;
}
nav button[aria-selected=true]{background:#fff;color:var(--brand)}
main{padding:14px 12px 32px;max-width:640px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:10px}

.row{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-left:4px solid transparent;
  border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);
  text-align:left;font:inherit;color:inherit;width:100%;
  transition:transform .08s;
}
button.row{cursor:pointer}
button.row:active{transform:scale(.985)}
.row.p1{border-left-color:var(--g1)} .row.p2{border-left-color:var(--g2)} .row.p3{border-left-color:var(--g3)}
.place{
  flex:0 0 36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums;
}
.p1 .place{background:var(--g1);color:#3b2c00} .p2 .place{background:var(--g2);color:#1f262b} .p3 .place{background:var(--g3);color:#301a08}
.code{
  flex:0 0 auto;min-width:46px;padding:0 8px;height:36px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:12.5px;letter-spacing:.02em;
  background:var(--bg);color:var(--brand2);
}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.nm{
  font-weight:600;font-size:16.5px;line-height:1.25;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sub{font-size:12.5px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:1px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:2px}
.pts{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  font-variant-numeric:tabular-nums;
}
.pts b{font-weight:800;font-size:20px;line-height:1;letter-spacing:-.02em}
.pts small{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:15px;line-height:1.5}

.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;
  background:var(--bg);border-radius:20px 20px 0 0;padding:8px 12px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.phead{display:flex;align-items:center;gap:14px;padding:0 4px 14px}
.phead .who{gap:4px}
.phead .big{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tline{
  display:flex;align-items:center;gap:12px;padding:12px 13px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:7px;
}
.tline.none{opacity:.45}
.tag{
  flex:0 0 auto;min-width:44px;text-align:center;font-size:11.5px;font-weight:700;
  padding:4px 7px;border-radius:7px;background:var(--bg);color:var(--muted);letter-spacing:.02em;
}
.tname{flex:1;min-width:0;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tval{flex:0 0 auto;font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px 12px 30px}
.refresh{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font:inherit;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <h1>Rezultāti</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="stamp">ielādē…</span></div>
  </div>
  <nav role="tablist">
    <button role="tab" id="tab-total" aria-selected="true">Kopvērtējums</button>
    <button role="tab" id="tab-task" aria-selected="false">Uzdevumi</button>
  </nav>
</header>

<main>
  <div class="list" id="list"><div class="empty">Ielādē rezultātus…</div></div>
  <footer>
    <button class="refresh" id="btnRefresh">Atjaunot tagad</button>
    <div id="foot" style="margin-top:12px"></div>
  </footer>
</main>

<div class="sheet" id="sheet">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="grab"></div>
    <div class="phead">
      <div class="place" id="dPlace">–</div>
      <div class="who">
        <div class="nm" id="dName" style="font-size:18px"></div>
        <div class="sub" id="dSub"></div>
      </div>
      <div class="big" id="dPts">0</div>
    </div>
    <div id="dTasks"></div>
  </div>
</div>

<script>
const SHEET_ID = '1yNf7ao3RczgtD4VqRvhtDAxhlYWqI5p2SeWMpV6Mn3E';
const GID = '813088766';
const SRC = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + GID;
const REFRESH_MS = 30000;
const CACHE_KEY = 'ligatne-results-v2';

const T_FIRST = 2, T_LAST = 22, I_PEN = 23, I_TOTAL = 24, I_PLACE = 25;

function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else if(c === '"'){ q=true; }
    else if(c === ','){ row.push(field); field=''; }
    else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c !== '\r'){ field+=c; }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function cellNum(v){
  const s = (v==null?'':String(v)).trim();
  if(s === '') return null;
  const n = parseFloat(s.replace(',', '.'));
  return isNaN(n) ? null : n;
}

function shape(rows){
  const head = rows[1] || [];
  const tasks = [];
  for(let c=T_FIRST;c<=T_LAST;c++){
    const raw = (head[c]||'').trim();
    if(!raw) continue;
    const sp = raw.indexOf(' ');
    tasks.push({col:c, code: sp<0 ? raw : raw.slice(0,sp), name: sp<0 ? raw : raw.slice(sp+1)});
  }
  const teams = [];
  for(let r=2;r<rows.length;r++){
    const row = rows[r]; if(!row) continue;
    const nr = (row[0]||'').trim();
    if(!/^\d+$/.test(nr)) continue;
    const scores = {};
    let done = 0;
    tasks.forEach(t=>{
      const v = cellNum(row[t.col]);
      scores[t.col] = v;
      if(v !== null) done++;
    });
    teams.push({
      nr:+nr,
      name:(row[1]||'').trim() || ('Komanda Nr.'+nr),
      scores, done,
      penalty: cellNum(row[I_PEN]) || 0,
      total: cellNum(row[I_TOTAL]),
      place: cellNum(row[I_PLACE])
    });
  }
  tasks.forEach(t=>{
    t.visited = teams.filter(x=>x.scores[t.col] !== null).length;
  });
  return {tasks, teams};
}

let DATA = null, view = 'total';
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e;};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n,one,few)=> n===1 ? one : few;

function fmtAgo(ts){
  const s = Math.round((Date.now()-ts)/1000);
  if(s<60) return 'pirms ' + s + ' s';
  const m = Math.round(s/60);
  if(m<60) return 'pirms ' + m + ' min';
  return 'pirms ' + Math.round(m/60) + ' h';
}

function renderTotal(list){
  const nT = DATA.tasks.length;
  const ranked = DATA.teams.filter(t=>t.total !== null)
    .map(t=>({t, val:t.total, place:t.place}))
    .sort((a,b)=> (b.val-a.val) || (a.t.nr-b.t.nr));
  if(!ranked.length){ list.appendChild(el('div','empty','Vēl nav neviena rezultāta.')); return; }
  const max = Math.max(...ranked.map(r=>r.val), 1);
  ranked.forEach(r=>{
    const p = r.place;
    const b = el('button','row' + (p && p<=3 ? ' p'+p : ''));
    b.innerHTML =
      '<span class="place">'+(p||'–')+'</span>'+
      '<span class="who">'+
        '<span class="nm">'+esc(r.t.name)+'</span>'+
        '<span class="sub">Nr.&nbsp;'+r.t.nr+' &nbsp;·&nbsp; '+r.t.done+' no '+nT+' uzdevumiem'+
          (r.t.penalty ? ' &nbsp;·&nbsp; sods −'+r.t.penalty : '')+'</span>'+
        '<span class="bar"><i style="width:'+Math.max(3, r.val/max*100)+'%"></i></span>'+
      '</span>'+
      '<span class="pts"><b>'+r.val+'</b><small>PUNKTI</small></span>';
    b.onclick = ()=>openTeam(r.t);
    list.appendChild(b);
  });
}

function renderTasks(list){
  const nTeams = DATA.teams.length;
  DATA.tasks.forEach(t=>{
    const d = el('div','row');
    d.innerHTML =
      '<span class="code">'+esc(t.code)+'</span>'+
      '<span class="who">'+
        '<span class="nm">'+esc(t.name)+'</span>'+
        '<span class="sub">'+t.visited+' no '+nTeams+' '+plural(t.visited,'komanda','komandām')+' apmeklējušas</span>'+
        '<span class="bar"><i style="width:'+(nTeams? t.visited/nTeams*100 : 0)+'%"></i></span>'+
      '</span>'+
      '<span class="pts"><b>'+t.visited+'</b><small>KOMANDAS</small></span>';
    list.appendChild(d);
  });
}

function render(){
  const list = $('#list'); list.innerHTML='';
  if(!DATA || !DATA.teams.length){ list.appendChild(el('div','empty','Nav datu.')); return; }
  if(view === 'total') renderTotal(list); else renderTasks(list);
}

function openTeam(t){
  const nT = DATA.tasks.length;
  $('#dName').textContent = t.name;
  $('#dSub').textContent = 'Nr. ' + t.nr + ' · ' + t.done + ' no ' + nT + ' uzdevumiem'
      + (t.penalty ? ' · sods −' + t.penalty : '');
  $('#dPts').textContent = t.total === null ? '–' : t.total;
  $('#dPlace').textContent = t.place === null ? '–' : t.place;
  const box = $('#dTasks'); box.innerHTML='';
  DATA.tasks.forEach(task=>{
    const v = t.scores[task.col];
    const line = el('div','tline' + (v===null?' none':''));
    line.innerHTML = '<span class="tag">'+esc(task.code)+'</span>'+
      '<span class="tname">'+esc(task.name)+'</span>'+
      '<span class="tval">'+(v===null ? '—' : v + ' p')+'</span>';
    box.appendChild(line);
  });
  $('#sheet').classList.add('on');
}

function setStatus(ts, ok){
  const dot = $('#dot');
  dot.className = 'dot' + (!ok ? ' off' : (Date.now()-ts > 3*REFRESH_MS ? ' stale' : ''));
  $('#stamp').textContent = ok ? fmtAgo(ts) : 'nav savienojuma';
  $('#foot').textContent = 'Atjaunojas automātiski ik 30 sekundes.';
}

async function load(){
  try{
    const res = await fetch(SRC + '&t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const text = await res.text();
    DATA = shape(parseCSV(text));
    const stamp = Date.now();
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({stamp, text})); }catch(e){}
    render(); setStatus(stamp, true);
  }catch(e){
    try{
      const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(c){ DATA = shape(parseCSV(c.text)); render(); setStatus(c.stamp, false); return; }
    }catch(_){}
    setStatus(Date.now(), false);
    if(!DATA) $('#list').innerHTML = '<div class="empty">Nevar ielādēt rezultātus.<br>Pārbaudi interneta savienojumu.</div>';
  }
}

$('#tab-total').onclick = ()=>{ view='total'; $('#tab-total').ariaSelected='true'; $('#tab-task').ariaSelected='false'; render(); };
$('#tab-task').onclick  = ()=>{ view='task';  $('#tab-total').ariaSelected='false'; $('#tab-task').ariaSelected='true'; render(); };
$('#btnRefresh').onclick = load;
$('#sheet').addEventListener('click', e=>{ if(e.target.dataset.close!==undefined) $('#sheet').classList.remove('on'); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
